name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test tests/InputFlip.Core.Tests --nologo
      - name: Build the app
        run: dotnet build src/InputFlip -c Release -p:Platform=x64 --nologo
